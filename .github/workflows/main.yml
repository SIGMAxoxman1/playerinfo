name: Build Inspect Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─────────────────────────────────────────────────────────
      # Generate ALL project files
      # ─────────────────────────────────────────────────────────
      - name: Create directories
        run: |
          mkdir -p src/main/java/com/inspectmod/client
          mkdir -p src/main/java/com/inspectmod/data
          mkdir -p src/main/java/com/inspectmod/mixin
          mkdir -p src/main/resources
          mkdir -p gradle/wrapper

      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'SETTINGSEOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "inspect-mod"
          SETTINGSEOF

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'PROPSEOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric 1.21.1 — Yarn mappings (stable + most mods support this)
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.9
          loom_version=1.7.4

          mod_version=1.0.0
          maven_group=com.inspectmod
          archives_base_name=inspect-mod

          fabric_version=0.110.0+1.21.1
          PROPSEOF

      - name: Write build.gradle
        run: |
          cat > build.gradle << 'BUILDEOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }
          version = project.mod_version
          group   = project.maven_group
          base { archivesName = project.archives_base_name }

          dependencies {
              minecraft       "com.mojang:minecraft:${project.minecraft_version}"
              mappings        "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          BUILDEOF

      - name: Write gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'WRAPEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPEOF

      - name: Write fabric.mod.json
        run: |
          cat > src/main/resources/fabric.mod.json << 'MODEOF'
          {
            "schemaVersion": 1,
            "id": "inspectmod",
            "version": "${version}",
            "name": "Inspect Mod",
            "description": "See armor, enchantments, shulker and bundle contents of nearby players!",
            "authors": ["YourName"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.inspectmod.client.InspectModClient"]
            },
            "mixins": ["inspectmod.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          MODEOF

      - name: Write inspectmod.mixins.json
        run: |
          cat > src/main/resources/inspectmod.mixins.json << 'MIXEOF'
          {
            "required": true,
            "package": "com.inspectmod.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["GameRendererMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          MIXEOF

      - name: Write ModConfig.java
        run: |
          cat > src/main/java/com/inspectmod/client/ModConfig.java << 'JAVAEOF'
          package com.inspectmod.client;
          public class ModConfig {
              public static boolean hudEnabled       = true;
              public static boolean showArmor        = true;
              public static boolean showEnchantments = true;
              public static boolean showMainHand     = true;
              public static boolean showOffHand      = true;
              public static boolean trackShulkers    = true;
              public static boolean trackBundles     = true;
              public static boolean autoDelete       = true;
          }
          JAVAEOF

      - name: Write PlayerSnapshot.java
        run: |
          cat > src/main/java/com/inspectmod/data/PlayerSnapshot.java << 'JAVAEOF'
          package com.inspectmod.data;
          import com.google.gson.*;
          import java.time.Instant;
          import java.util.*;

          public class PlayerSnapshot {
              public long   timestamp;
              public String playerName;
              public Map<String, List<ContainerEntry>> containers = new LinkedHashMap<>();

              public PlayerSnapshot(String name) {
                  this.playerName = name;
                  this.timestamp  = Instant.now().toEpochMilli();
              }

              public static class ContainerEntry {
                  public String type, color, itemId;
                  public List<String> contents = new ArrayList<>();

                  public JsonObject toJson() {
                      JsonObject o = new JsonObject();
                      o.addProperty("type",   type);
                      o.addProperty("color",  color);
                      o.addProperty("itemId", itemId);
                      JsonArray a = new JsonArray();
                      contents.forEach(a::add);
                      o.add("contents", a);
                      return o;
                  }
                  public static ContainerEntry fromJson(JsonObject o) {
                      ContainerEntry e = new ContainerEntry();
                      e.type   = o.get("type").getAsString();
                      e.color  = o.get("color").getAsString();
                      e.itemId = o.get("itemId").getAsString();
                      o.get("contents").getAsJsonArray().forEach(el -> e.contents.add(el.getAsString()));
                      return e;
                  }
              }

              public JsonObject toJson() {
                  JsonObject o = new JsonObject();
                  o.addProperty("player", playerName);
                  o.addProperty("timestamp", timestamp);
                  JsonObject c = new JsonObject();
                  containers.forEach((k, v) -> {
                      JsonArray a = new JsonArray(); v.forEach(e -> a.add(e.toJson())); c.add(k, a);
                  });
                  o.add("containers", c);
                  return o;
              }
              public static PlayerSnapshot fromJson(JsonObject o) {
                  PlayerSnapshot s = new PlayerSnapshot(o.get("player").getAsString());
                  s.timestamp = o.get("timestamp").getAsLong();
                  JsonObject c = o.getAsJsonObject("containers");
                  if (c != null) for (var e : c.entrySet()) {
                      List<ContainerEntry> list = new ArrayList<>();
                      e.getValue().getAsJsonArray().forEach(el -> list.add(ContainerEntry.fromJson(el.getAsJsonObject())));
                      s.containers.put(e.getKey(), list);
                  }
                  return s;
              }
          }
          JAVAEOF

      - name: Write StoredPlayerData.java
        run: |
          cat > src/main/java/com/inspectmod/data/StoredPlayerData.java << 'JAVAEOF'
          package com.inspectmod.data;
          import com.google.gson.*;
          import net.minecraft.client.MinecraftClient;
          import java.nio.file.*;
          import java.time.Instant;
          import java.util.*;

          public class StoredPlayerData {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static Path dataFile;
              public static final Map<String, List<PlayerSnapshot>> allData = new LinkedHashMap<>();
              public static boolean autoDeleteEnabled = true;

              public static void load() {
                  dataFile = MinecraftClient.getInstance().runDirectory.toPath()
                      .resolve("inspect-mod-data/players.json");
                  if (!Files.exists(dataFile)) return;
                  try {
                      JsonObject root = JsonParser.parseString(Files.readString(dataFile)).getAsJsonObject();
                      autoDeleteEnabled = root.has("autoDelete") && root.get("autoDelete").getAsBoolean();
                      JsonObject players = root.getAsJsonObject("players");
                      if (players == null) return;
                      for (var e : players.entrySet()) {
                          List<PlayerSnapshot> snaps = new ArrayList<>();
                          e.getValue().getAsJsonArray().forEach(el ->
                              snaps.add(PlayerSnapshot.fromJson(el.getAsJsonObject())));
                          allData.put(e.getKey(), snaps);
                      }
                  } catch (Exception e) { System.err.println("[InspectMod] Load error: " + e.getMessage()); }
              }

              public static void save() {
                  try {
                      Files.createDirectories(dataFile.getParent());
                      JsonObject root = new JsonObject();
                      root.addProperty("autoDelete", autoDeleteEnabled);
                      JsonObject players = new JsonObject();
                      allData.forEach((name, snaps) -> {
                          JsonArray a = new JsonArray(); snaps.forEach(s -> a.add(s.toJson())); players.add(name, a);
                      });
                      root.add("players", players);
                      Files.writeString(dataFile, GSON.toJson(root));
                  } catch (Exception e) { System.err.println("[InspectMod] Save error: " + e.getMessage()); }
              }

              public static void addSnapshot(String name, PlayerSnapshot snap) {
                  allData.computeIfAbsent(name, k -> new ArrayList<>()).add(0, snap);
                  save();
              }

              public static void runAutoDelete() {
                  if (!autoDeleteEnabled) return;
                  long cutoff = Instant.now().minusSeconds(30 * 86400L).toEpochMilli();
                  allData.forEach((n, s) -> s.removeIf(x -> x.timestamp < cutoff));
                  allData.entrySet().removeIf(e -> e.getValue().isEmpty());
                  save();
              }

              public static Map<String, List<PlayerSnapshot>> getRecent() {
                  long cutoff = Instant.now().minusSeconds(86400L).toEpochMilli();
                  Map<String, List<PlayerSnapshot>> r = new LinkedHashMap<>();
                  allData.forEach((n, s) -> { var f = s.stream().filter(x -> x.timestamp >= cutoff).toList(); if (!f.isEmpty()) r.put(n, f); });
                  return r;
              }

              public static Map<String, List<PlayerSnapshot>> getArchive() {
                  long cutoff = Instant.now().minusSeconds(86400L).toEpochMilli();
                  Map<String, List<PlayerSnapshot>> r = new LinkedHashMap<>();
                  allData.forEach((n, s) -> { var f = s.stream().filter(x -> x.timestamp < cutoff).toList(); if (!f.isEmpty()) r.put(n, f); });
                  return r;
              }
          }
          JAVAEOF

      - name: Write PlayerTracker.java
        run: |
          cat > src/main/java/com/inspectmod/data/PlayerTracker.java << 'JAVAEOF'
          package com.inspectmod.data;

          import com.inspectmod.client.ModConfig;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.component.type.BundleContentsComponent;
          import net.minecraft.component.type.ContainerComponent;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.ItemStack;

          import java.util.*;

          public class PlayerTracker {
              private static final Map<String, String> lastHash = new HashMap<>();

              public static void tick(Iterable<? extends PlayerEntity> players) {
                  for (PlayerEntity player : players) {
                      String name = player.getName().getString();
                      List<PlayerSnapshot.ContainerEntry> found = new ArrayList<>();

                      for (ItemStack stack : getStacks(player)) {
                          if (stack.isEmpty()) continue;
                          String id = stack.getItem().toString();
                          if (ModConfig.trackShulkers && id.contains("shulker_box")) {
                              var e = new PlayerSnapshot.ContainerEntry();
                              e.type = "shulker"; e.color = shulkerColor(id); e.itemId = id;
                              e.contents = readContainer(stack);
                              found.add(e);
                          } else if (ModConfig.trackBundles && id.contains("bundle")) {
                              var e = new PlayerSnapshot.ContainerEntry();
                              e.type = "bundle"; e.color = "orange"; e.itemId = id;
                              e.contents = readBundle(stack);
                              found.add(e);
                          }
                      }

                      if (found.isEmpty()) continue;
                      String hash = found.toString();
                      if (hash.equals(lastHash.get(name))) continue;
                      lastHash.put(name, hash);
                      PlayerSnapshot snap = new PlayerSnapshot(name);
                      snap.containers.put("held", found);
                      StoredPlayerData.addSnapshot(name, snap);
                  }
              }

              private static List<ItemStack> getStacks(PlayerEntity p) {
                  List<ItemStack> s = new ArrayList<>();
                  s.add(p.getMainHandStack()); s.add(p.getOffHandStack());
                  p.getArmorItems().forEach(s::add);
                  return s;
              }

              private static List<String> readContainer(ItemStack stack) {
                  List<String> out = new ArrayList<>();
                  ContainerComponent c = stack.get(DataComponentTypes.CONTAINER);
                  if (c == null) return out;
                  // iterate() returns all slots; we skip empty
                  for (ItemStack item : c.iterate()) {
                      if (!item.isEmpty())
                          out.add(cleanId(item.getItem().toString())
                              + (item.getCount() > 1 ? " x" + item.getCount() : ""));
                  }
                  return out;
              }

              private static List<String> readBundle(ItemStack stack) {
                  List<String> out = new ArrayList<>();
                  BundleContentsComponent b = stack.get(DataComponentTypes.BUNDLE_CONTENTS);
                  if (b == null) return out;
                  // BundleContentsComponent implements Iterable<ItemStack> in 1.21.1
                  for (ItemStack item : b) {
                      if (!item.isEmpty())
                          out.add(cleanId(item.getItem().toString())
                              + (item.getCount() > 1 ? " x" + item.getCount() : ""));
                  }
                  return out;
              }

              private static String shulkerColor(String id) {
                  for (String c : new String[]{"white","orange","magenta","light_blue","yellow",
                      "lime","pink","gray","light_gray","cyan","purple","blue","brown","green","red","black"})
                      if (id.contains(c)) return c;
                  return "purple";
              }

              private static String cleanId(String id) {
                  String n = id.replace("minecraft:", "").replace("_", " ");
                  StringBuilder sb = new StringBuilder();
                  for (String w : n.split(" ")) if (!w.isEmpty())
                      sb.append(Character.toUpperCase(w.charAt(0))).append(w.substring(1)).append(" ");
                  return sb.toString().trim();
              }
          }
          JAVAEOF

      - name: Write InspectHud.java
        run: |
          cat > src/main/java/com/inspectmod/client/InspectHud.java << 'JAVAEOF'
          package com.inspectmod.client;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.enchantment.Enchantment;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.equipment.trim.ArmorTrim;
          import net.minecraft.registry.entry.RegistryEntry;
          import net.minecraft.entity.player.PlayerEntity;

          import java.util.Map;

          public class InspectHud {

              public static void render(DrawContext ctx, RenderTickCounter counter) {
                  if (!ModConfig.hudEnabled) return;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.world == null || mc.player == null) return;
                  for (PlayerEntity p : mc.world.getPlayers()) {
                      if (p == mc.player) continue;
                      if (mc.player.distanceTo(p) > 32) continue;
                      renderTag(ctx, mc, p);
                  }
              }

              private static void renderTag(DrawContext ctx, MinecraftClient mc, PlayerEntity player) {
                  int sw = mc.getWindow().getScaledWidth();
                  int sh = mc.getWindow().getScaledHeight();
                  int sx = sw / 2, sy = sh / 2 - 40;
                  String name = player.getName().getString();
                  int nw = mc.textRenderer.getWidth(name);

                  // Main hand — left of name
                  ItemStack main = player.getMainHandStack();
                  if (ModConfig.showMainHand && !main.isEmpty()) {
                      int ix = sx - nw / 2 - 22;
                      ctx.drawItem(main, ix, sy - 8);
                      if (ModConfig.showEnchantments) drawEnchants(ctx, mc, main, ix - 2, sy - 8, true);
                  }

                  // Off hand — right of name
                  ItemStack off = player.getOffHandStack();
                  if (ModConfig.showOffHand && !off.isEmpty()) {
                      int ix = sx + nw / 2 + 4;
                      ctx.drawItem(off, ix, sy - 8);
                      if (ModConfig.showEnchantments) drawEnchants(ctx, mc, off, ix + 18, sy - 8, false);
                  }

                  // Armor row below name
                  if (ModConfig.showArmor) {
                      int ax = sx - 32, ay = sy + 2, slot = 0;
                      for (ItemStack armor : player.getArmorItems()) {
                          if (!armor.isEmpty()) {
                              ctx.drawItem(armor, ax + slot * 18, ay);
                              if (ModConfig.showEnchantments)
                                  drawEnchantsBelow(ctx, mc, armor, ax + slot * 18, ay + 18);
                          }
                          slot++;
                      }
                  }
              }

              private static void drawEnchants(DrawContext ctx, MinecraftClient mc,
                                               ItemStack stack, int x, int y, boolean left) {
                  var enchs = stack.get(DataComponentTypes.ENCHANTMENTS);
                  if (enchs == null) return;
                  int ey = y;
                  for (RegistryEntry<Enchantment> e : enchs.getEnchantments()) {
                      int lvl = enchs.getLevel(e);
                      String txt = "\u00a7b" + abbr(e.value().description().getString()) + " " + roman(lvl);
                      int tw = mc.textRenderer.getWidth(txt);
                      int ex = left ? x - tw : x;
                      ctx.fill(ex-1, ey-1, ex+tw+1, ey+8, 0x88000000);
                      ctx.drawTextWithShadow(mc.textRenderer, txt, ex, ey, 0xFFFFFF);
                      ey += 9;
                  }
              }

              private static void drawEnchantsBelow(DrawContext ctx, MinecraftClient mc,
                                                    ItemStack stack, int x, int y) {
                  var enchs = stack.get(DataComponentTypes.ENCHANTMENTS);
                  if (enchs == null) return;
                  int ey = y;
                  for (RegistryEntry<Enchantment> e : enchs.getEnchantments()) {
                      int lvl = enchs.getLevel(e);
                      String txt = "\u00a7b" + abbr(e.value().description().getString()) + " " + roman(lvl);
                      ctx.fill(x-1, ey-1, x+36, ey+8, 0x88000000);
                      ctx.drawTextWithShadow(mc.textRenderer, txt, x, ey, 0xFFFFFF);
                      ey += 9;
                  }
              }

              private static String abbr(String s) {
                  return Map.of("Sharpness","Sharp","Protection","Prot","Unbreaking","Unbr",
                      "Efficiency","Eff","Fortune","Fort","Power","Pow","Mending","Mend",
                      "Looting","Loot","Feather Falling","FF","Blast Protection","BlastP"
                  ).getOrDefault(s, s.length() > 6 ? s.substring(0, 5) : s);
              }

              private static String roman(int n) {
                  String[] r = {"","I","II","III","IV","V","VI","VII","VIII","IX","X"};
                  return (n >= 1 && n <= 10) ? r[n] : String.valueOf(n);
              }
          }
          JAVAEOF

      - name: Write MainScreen.java
        run: |
          cat > src/main/java/com/inspectmod/client/MainScreen.java << 'JAVAEOF'
          package com.inspectmod.client;

          import com.inspectmod.data.PlayerSnapshot;
          import com.inspectmod.data.StoredPlayerData;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;

          import java.time.*;
          import java.time.format.DateTimeFormatter;
          import java.util.*;

          public class MainScreen extends Screen {
              private boolean showArchive = false;
              private int scroll = 0;
              private PopupData popup = null;

              private static final Map<String,Integer> COLORS = Map.ofEntries(
                  Map.entry("white",0xDDDDDD), Map.entry("orange",0xFF6A00),
                  Map.entry("magenta",0xDD00DD), Map.entry("light_blue",0x00BFFF),
                  Map.entry("yellow",0xFFFF00), Map.entry("lime",0x7CFF00),
                  Map.entry("pink",0xFF69B4), Map.entry("gray",0x808080),
                  Map.entry("light_gray",0xAAAAAA), Map.entry("cyan",0x00CED1),
                  Map.entry("purple",0x9400D3), Map.entry("blue",0x0000FF),
                  Map.entry("brown",0x8B4513), Map.entry("green",0x00AA00),
                  Map.entry("red",0xFF0000), Map.entry("black",0x444444)
              );

              public MainScreen() { super(Text.literal("Inspect Mod")); }

              @Override
              protected void init() {
                  int w = this.width;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Recent"),
                      b -> { showArchive = false; scroll = 0; }).dimensions(w/2-120, 8, 110, 20).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Archive"),
                      b -> { showArchive = true; scroll = 0; }).dimensions(w/2+10, 8, 110, 20).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Settings"),
                      b -> client.setScreen(new SettingsScreen(this))).dimensions(w-72, 8, 64, 20).build());
                  addDrawableChild(ButtonWidget.builder(
                      Text.literal("Auto-Delete: " + (StoredPlayerData.autoDeleteEnabled ? "ON" : "OFF")),
                      b -> {
                          StoredPlayerData.autoDeleteEnabled = !StoredPlayerData.autoDeleteEnabled;
                          b.setMessage(Text.literal("Auto-Delete: " + (StoredPlayerData.autoDeleteEnabled ? "ON" : "OFF")));
                          StoredPlayerData.save();
                      }).dimensions(8, 8, 130, 20).build());
              }

              @Override
              public void render(DrawContext g, int mx, int my, float delta) {
                  g.fill(0, 0, width, height, 0xDD101010);
                  g.fill(0, 32, width, 33, 0xFF444444);

                  Map<String, List<PlayerSnapshot>> data = showArchive
                      ? StoredPlayerData.getArchive() : StoredPlayerData.getRecent();

                  int y = 40 - scroll, rowH = 36;
                  if (data.isEmpty())
                      g.drawCenteredTextWithShadow(textRenderer,
                          Text.literal(showArchive ? "No archive yet." : "No players seen yet!"),
                          width/2, height/2, 0xAAAAAA);

                  for (var entry : data.entrySet()) {
                      String pName = entry.getKey();
                      var snaps = entry.getValue();
                      if (snaps.isEmpty()) continue;
                      var latest = snaps.get(0);

                      g.fill(8, y, width-8, y+rowH-2, 0x88222222);
                      g.fill(8, y, width-8, y+1, 0x88555555);
                      g.drawTextWithShadow(textRenderer, pName, 14, y+4, 0xFFD700);
                      g.drawTextWithShadow(textRenderer, fmt(latest.timestamp), 14, y+16, 0x888888);

                      int iconX = 160;
                      for (var ce : latest.containers.values())
                          for (var c : ce) {
                              int col = COLORS.getOrDefault(c.color, 0x9400D3);
                              g.fill(iconX, y+6, iconX+20, y+26, 0xFF000000 | (col & 0xFFFFFF));
                              g.drawCenteredTextWithShadow(textRenderer,
                                  Text.literal("bundle".equals(c.type) ? "B" : "S"),
                                  iconX+10, y+12, 0xFFFFFF);
                              if (mx>=iconX && mx<=iconX+20 && my>=y+6 && my<=y+26)
                                  popup = new PopupData(pName, c, mx, my);
                              iconX += 24;
                          }
                      y += rowH;
                  }

                  if (popup != null) { drawPopup(g, popup); popup = null; }
                  super.render(g, mx, my, delta);
              }

              private void drawPopup(DrawContext g, PopupData p) {
                  int pw = 170, ph = 20 + p.entry.contents.size() * 11;
                  int px = Math.min(p.x+4, width-pw-4);
                  int py = Math.min(p.y+4, height-ph-4);
                  g.fill(px, py, px+pw, py+ph, 0xEE111111);
                  g.fill(px, py, px+pw, py+1, 0xFFD4A017);
                  g.fill(px, py, px+1, py+ph, 0xFFD4A017);
                  g.fill(px+pw-1, py, px+pw, py+ph, 0xFFD4A017);
                  g.fill(px, py+ph-1, px+pw, py+ph, 0xFFD4A017);
                  String title = ("shulker".equals(p.entry.type) ? "Shulker" : "Bundle")
                      + " [" + p.entry.color + "] - " + p.playerName;
                  g.drawTextWithShadow(textRenderer, title, px+4, py+4, 0xFFD700);
                  int ly = py + 16;
                  if (p.entry.contents.isEmpty())
                      g.drawTextWithShadow(textRenderer, "(empty)", px+8, ly, 0x888888);
                  else for (String item : p.entry.contents) {
                      g.drawTextWithShadow(textRenderer, "* " + item, px+8, ly, 0xFFFFFF);
                      ly += 11;
                  }
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double h, double v) {
                  scroll -= (int)(v * 12); if (scroll < 0) scroll = 0; return true;
              }
              @Override public boolean shouldPause() { return false; }

              private String fmt(long ms) {
                  return DateTimeFormatter.ofPattern("MM/dd HH:mm")
                      .withZone(ZoneId.systemDefault()).format(Instant.ofEpochMilli(ms));
              }
              private record PopupData(String playerName, PlayerSnapshot.ContainerEntry entry, int x, int y) {}
          }
          JAVAEOF

      - name: Write SettingsScreen.java
        run: |
          cat > src/main/java/com/inspectmod/client/SettingsScreen.java << 'JAVAEOF'
          package com.inspectmod.client;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;
          import java.util.function.*;

          public class SettingsScreen extends Screen {
              private final Screen parent;
              public SettingsScreen(Screen parent) { super(Text.literal("Settings")); this.parent = parent; }

              @Override
              protected void init() {
                  int cx = width/2, y = 40, bw = 220, bh = 20, gap = 24;
                  tog("HUD (above players)",   cx, y,       bw, bh, () -> ModConfig.hudEnabled,       v -> ModConfig.hudEnabled = v);
                  tog("Show Armor",            cx, y+gap,   bw, bh, () -> ModConfig.showArmor,        v -> ModConfig.showArmor = v);
                  tog("Show Enchantments",     cx, y+gap*2, bw, bh, () -> ModConfig.showEnchantments, v -> ModConfig.showEnchantments = v);
                  tog("Show Main Hand",        cx, y+gap*3, bw, bh, () -> ModConfig.showMainHand,     v -> ModConfig.showMainHand = v);
                  tog("Show Off Hand",         cx, y+gap*4, bw, bh, () -> ModConfig.showOffHand,      v -> ModConfig.showOffHand = v);
                  tog("Track Shulkers",        cx, y+gap*5, bw, bh, () -> ModConfig.trackShulkers,    v -> ModConfig.trackShulkers = v);
                  tog("Track Bundles",         cx, y+gap*6, bw, bh, () -> ModConfig.trackBundles,     v -> ModConfig.trackBundles = v);
                  addDrawableChild(ButtonWidget.builder(Text.literal("Back"),
                      b -> client.setScreen(parent)).dimensions(cx-bw/2, y+gap*7+10, bw, bh).build());
              }

              private void tog(String lbl, int cx, int y, int bw, int bh,
                               Supplier<Boolean> get, Consumer<Boolean> set) {
                  addDrawableChild(ButtonWidget.builder(
                      Text.literal(lbl + ": " + (get.get() ? "\u00a7aON" : "\u00a7cOFF")),
                      b -> { set.accept(!get.get());
                          b.setMessage(Text.literal(lbl + ": " + (get.get() ? "\u00a7aON" : "\u00a7cOFF"))); }
                  ).dimensions(cx-bw/2, y, bw, bh).build());
              }

              @Override
              public void render(DrawContext g, int mx, int my, float d) {
                  g.fill(0, 0, width, height, 0xDD101010);
                  g.drawCenteredTextWithShadow(textRenderer, Text.literal("Inspect Mod - Settings"), width/2, 14, 0xFFD700);
                  super.render(g, mx, my, d);
              }
              @Override public boolean shouldPause() { return false; }
          }
          JAVAEOF

      - name: Write GameRendererMixin.java
        run: |
          cat > src/main/java/com/inspectmod/mixin/GameRendererMixin.java << 'JAVAEOF'
          package com.inspectmod.mixin;
          import net.minecraft.client.render.GameRenderer;
          import org.spongepowered.asm.mixin.Mixin;
          @Mixin(GameRenderer.class)
          public class GameRendererMixin {}
          JAVAEOF

      - name: Write InspectModClient.java
        run: |
          cat > src/main/java/com/inspectmod/client/InspectModClient.java << 'JAVAEOF'
          package com.inspectmod.client;

          import com.inspectmod.data.PlayerTracker;
          import com.inspectmod.data.StoredPlayerData;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class InspectModClient implements ClientModInitializer {
              public static KeyBinding openKey, hudKey;
              private int tick = 0;

              @Override
              public void onInitializeClient() {
                  StoredPlayerData.load();
                  StoredPlayerData.runAutoDelete();

                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.inspectmod.open", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_G, "Inspect Mod"));
                  hudKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.inspectmod.hud", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_H, "Inspect Mod"));

                  HudRenderCallback.EVENT.register((ctx, counter) -> InspectHud.render(ctx, counter));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openKey.wasPressed()) client.setScreen(new MainScreen());
                      while (hudKey.wasPressed())  ModConfig.hudEnabled = !ModConfig.hudEnabled;
                      if (client.world != null && ++tick >= 20) {
                          tick = 0;
                          if (ModConfig.trackShulkers || ModConfig.trackBundles)
                              PlayerTracker.tick(client.world.getPlayers());
                      }
                  });
              }
          }
          JAVAEOF

      # ─────────────────────────────────────────────────────────
      # Gradle wrapper + Build
      # ─────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download gradle-wrapper.jar
        run: |
          curl -sL "https://github.com/gradle/gradle/raw/refs/tags/v8.10.2/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Write gradlew
        run: |
          printf '#!/bin/sh\nexec java -classpath "$0/../gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          cat > gradlew << 'GRADLEWEOF'
          #!/bin/sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd)"
          exec java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEWEOF
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: inspect-mod-1.21.1
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
