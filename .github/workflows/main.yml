      # ── InspectModClient.java ────────────────────────────────
      - name: Write InspectModClient.java
        run: |
          cat > src/main/java/com/inspectmod/client/InspectModClient.java << 'EOF'
          package com.inspectmod.client;

          import com.inspectmod.data.PlayerTracker;
          import com.inspectmod.data.StoredPlayerData;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.KeyMapping;
          import com.mojang.blaze3d.platform.InputConstants;
          import org.lwjgl.glfw.GLFW;

          public class InspectModClient implements ClientModInitializer {

              public static KeyMapping openGuiKey;
              public static KeyMapping toggleHudKey;
              private int tickCounter = 0;

              @Override
              public void onInitializeClient() {
                  StoredPlayerData.load();
                  StoredPlayerData.runAutoDelete();

                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyMapping(
                      "key.inspectmod.open_gui",
                      InputConstants.Type.KEYSYM,
                      GLFW.GLFW_KEY_G,
                      "Inspect Mod"));

                  toggleHudKey = KeyBindingHelper.registerKeyBinding(new KeyMapping(
                      "key.inspectmod.toggle_hud",
                      InputConstants.Type.KEYSYM,
                      GLFW.GLFW_KEY_H,
                      "Inspect Mod"));

                  // In 1.21.11 HudRenderCallback passes (GuiGraphics, float)
                  HudRenderCallback.EVENT.register((graphics, tickDelta) ->
                      InspectHud.render(graphics, tickDelta));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openGuiKey.consumeClick())
                          client.setScreen(new MainScreen());
                      while (toggleHudKey.consumeClick())
                          ModConfig.hudEnabled = !ModConfig.hudEnabled;

                      if (client.level != null && ++tickCounter >= 20) {
                          tickCounter = 0;
                          if (ModConfig.trackShulkers || ModConfig.trackBundles)
                              PlayerTracker.tick(client.level.players());
                      }
                  });
              }
          }
          EOF

      # ─────────────────────────────────────────────────────────
      # 3. Gradle wrapper + Build
      # ─────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download Gradle wrapper jar
        run: |
          curl -sL "https://github.com/gradle/gradle/raw/refs/tags/v8.13.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || \
          curl -sL "https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/8.13/gradle-wrapper-8.13.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || true

      - name: Write gradlew
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME="`pwd -P`"
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      # ─────────────────────────────────────────────────────────
      # 4. Upload artifact
      # ─────────────────────────────────────────────────────────
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: inspect-mod-1.21.11
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
