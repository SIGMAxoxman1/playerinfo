      # ── InspectModClient.java ────────────────────────────────
      - name: Write InspectModClient.java
        run: |
          cat > src/main/java/com/inspectmod/client/InspectModClient.java << 'EOF'
          package com.inspectmod.client;

          import com.inspectmod.data.PlayerTracker;
          import com.inspectmod.data.StoredPlayerData;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class InspectModClient implements ClientModInitializer {

              public static KeyBinding openGuiKey;
              public static KeyBinding toggleHudKey;
              private int tickCounter = 0;

              @Override
              public void onInitializeClient() {
                  // Load saved data
                  StoredPlayerData.load();
                  StoredPlayerData.runAutoDelete();

                  // Keybindings
                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.inspectmod.open_gui", InputUtil.Type.KEYSYM,
                      GLFW.GLFW_KEY_G, "Inspect Mod"));

                  toggleHudKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.inspectmod.toggle_hud", InputUtil.Type.KEYSYM,
                      GLFW.GLFW_KEY_H, "Inspect Mod"));

                  // HUD render
                  HudRenderCallback.EVENT.register((ctx, tickDelta) ->
                      InspectHud.render(ctx, tickDelta));

                  // Tick: track players every 20 ticks (1 second)
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      // Key: open main screen
                      while (openGuiKey.wasPressed())
                          client.setScreen(new MainScreen());

                      // Key: toggle HUD
                      while (toggleHudKey.wasPressed())
                          ModConfig.hudEnabled = !ModConfig.hudEnabled;

                      // Track shulkers/bundles every second
                      if (client.world != null && ++tickCounter >= 20) {
                          tickCounter = 0;
                          if (ModConfig.trackShulkers || ModConfig.trackBundles)
                              PlayerTracker.tick(client.world.getPlayers());
                      }
                  });
              }
          }
          EOF

      # ─────────────────────────────────────────────────────────
      # 4. Setup Gradle & Build
      # ─────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/refs/tags/v8.10.2/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/

      - name: Generate gradlew
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME="`pwd -P`"
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      # ─────────────────────────────────────────────────────────
      # 5. Upload artifact
      # ─────────────────────────────────────────────────────────
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: inspect-mod-1.21.1
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
