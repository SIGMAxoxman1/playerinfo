name: Build Inspect Mod 1.21.11

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # ─────────────────────────────────────────────────────────
      # 1. Checkout + Java 21
      # ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─────────────────────────────────────────────────────────
      # 2. Generate ALL project files
      # ─────────────────────────────────────────────────────────
      - name: Create directory structure
        run: |
          mkdir -p src/main/java/com/inspectmod/client
          mkdir -p src/main/java/com/inspectmod/data
          mkdir -p src/main/java/com/inspectmod/mixin
          mkdir -p src/main/resources
          mkdir -p gradle/wrapper

      # ── settings.gradle ──────────────────────────────────────
      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "inspect-mod"
          EOF

      # ── gradle.properties ────────────────────────────────────
      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          loader_version=0.18.1
          loom_version=1.14.+

          mod_version=1.0.0
          maven_group=com.inspectmod
          archives_base_name=inspect-mod

          fabric_version=0.141.4+1.21.11
          EOF

      # ── build.gradle ─────────────────────────────────────────
      - name: Write build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group   = project.maven_group
          base { archivesName = project.archives_base_name }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft       "com.mojang:minecraft:${project.minecraft_version}"
              // Mojang Official Mappings — best for 1.21.11
              mappings        loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

      # ── gradle wrapper properties ─────────────────────────────
      - name: Write gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      # ── fabric.mod.json ──────────────────────────────────────
      - name: Write fabric.mod.json
        run: |
          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "inspectmod",
            "version": "${version}",
            "name": "Inspect Mod",
            "description": "See armor, enchantments, shulker and bundle contents of nearby players!",
            "authors": ["YourName"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.inspectmod.client.InspectModClient"]
            },
            "mixins": ["inspectmod.mixins.json"],
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      # ── mixins json ──────────────────────────────────────────
      - name: Write inspectmod.mixins.json
        run: |
          cat > src/main/resources/inspectmod.mixins.json << 'EOF'
          {
            "required": true,
            "package": "com.inspectmod.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["GameRendererMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

      # ── ModConfig.java ───────────────────────────────────────
      - name: Write ModConfig.java
        run: |
          cat > src/main/java/com/inspectmod/client/ModConfig.java << 'EOF'
          package com.inspectmod.client;

          public class ModConfig {
              public static boolean hudEnabled        = true;
              public static boolean showArmor         = true;
              public static boolean showEnchantments  = true;
              public static boolean showMainHand      = true;
              public static boolean showOffHand       = true;
              public static boolean trackShulkers     = true;
              public static boolean trackBundles      = true;
              public static boolean autoDeleteArchive = true;
          }
          EOF

      # ── PlayerSnapshot.java ──────────────────────────────────
      - name: Write PlayerSnapshot.java
        run: |
          cat > src/main/java/com/inspectmod/data/PlayerSnapshot.java << 'EOF'
          package com.inspectmod.data;

          import com.google.gson.*;
          import java.time.Instant;
          import java.util.*;

          public class PlayerSnapshot {

              public long   timestamp;
              public String playerName;
              public Map<String, List<ContainerEntry>> containers = new LinkedHashMap<>();

              public PlayerSnapshot(String playerName) {
                  this.playerName = playerName;
                  this.timestamp  = Instant.now().toEpochMilli();
              }

              public static class ContainerEntry {
                  public String type;
                  public String color;
                  public String itemId;
                  public List<String> contents = new ArrayList<>();

                  public JsonObject toJson() {
                      JsonObject o = new JsonObject();
                      o.addProperty("type",   type);
                      o.addProperty("color",  color);
                      o.addProperty("itemId", itemId);
                      JsonArray arr = new JsonArray();
                      contents.forEach(arr::add);
                      o.add("contents", arr);
                      return o;
                  }

                  public static ContainerEntry fromJson(JsonObject o) {
                      ContainerEntry e = new ContainerEntry();
                      e.type   = o.get("type").getAsString();
                      e.color  = o.get("color").getAsString();
                      e.itemId = o.get("itemId").getAsString();
                      o.get("contents").getAsJsonArray()
                              .forEach(el -> e.contents.add(el.getAsString()));
                      return e;
                  }
              }

              public JsonObject toJson() {
                  JsonObject o = new JsonObject();
                  o.addProperty("player",    playerName);
                  o.addProperty("timestamp", timestamp);
                  JsonObject cons = new JsonObject();
                  containers.forEach((slot, entries) -> {
                      JsonArray arr = new JsonArray();
                      entries.forEach(e -> arr.add(e.toJson()));
                      cons.add(slot, arr);
                  });
                  o.add("containers", cons);
                  return o;
              }

              public static PlayerSnapshot fromJson(JsonObject o) {
                  PlayerSnapshot s = new PlayerSnapshot(o.get("player").getAsString());
                  s.timestamp = o.get("timestamp").getAsLong();
                  JsonObject cons = o.getAsJsonObject("containers");
                  if (cons != null) {
                      for (var entry : cons.entrySet()) {
                          List<ContainerEntry> list = new ArrayList<>();
                          entry.getValue().getAsJsonArray()
                                  .forEach(el -> list.add(ContainerEntry.fromJson(el.getAsJsonObject())));
                          s.containers.put(entry.getKey(), list);
                      }
                  }
                  return s;
              }
          }
          EOF

      # ── StoredPlayerData.java ────────────────────────────────
      - name: Write StoredPlayerData.java
        run: |
          cat > src/main/java/com/inspectmod/data/StoredPlayerData.java << 'EOF'
          package com.inspectmod.data;

          import com.google.gson.*;
          import net.minecraft.client.Minecraft;

          import java.io.*;
          import java.nio.file.*;
          import java.time.*;
          import java.util.*;

          public class StoredPlayerData {

              public static final int ARCHIVE_DAYS = 30;
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static Path dataFile;

              public static final Map<String, List<PlayerSnapshot>> allData = new LinkedHashMap<>();
              public static boolean autoDeleteEnabled = true;

              public static void load() {
                  dataFile = getDataPath();
                  if (!Files.exists(dataFile)) return;
                  try {
                      String json = Files.readString(dataFile);
                      JsonObject root = JsonParser.parseString(json).getAsJsonObject();
                      autoDeleteEnabled = root.has("autoDelete") && root.get("autoDelete").getAsBoolean();
                      JsonObject players = root.getAsJsonObject("players");
                      if (players == null) return;
                      for (var entry : players.entrySet()) {
                          List<PlayerSnapshot> snaps = new ArrayList<>();
                          for (JsonElement el : entry.getValue().getAsJsonArray())
                              snaps.add(PlayerSnapshot.fromJson(el.getAsJsonObject()));
                          allData.put(entry.getKey(), snaps);
                      }
                  } catch (Exception e) {
                      System.err.println("[InspectMod] Load failed: " + e.getMessage());
                  }
              }

              public static void save() {
                  try {
                      Files.createDirectories(dataFile.getParent());
                      JsonObject root = new JsonObject();
                      root.addProperty("autoDelete", autoDeleteEnabled);
                      JsonObject players = new JsonObject();
                      allData.forEach((name, snaps) -> {
                          JsonArray arr = new JsonArray();
                          snaps.forEach(s -> arr.add(s.toJson()));
                          players.add(name, arr);
                      });
                      root.add("players", players);
                      Files.writeString(dataFile, GSON.toJson(root));
                  } catch (Exception e) {
                      System.err.println("[InspectMod] Save failed: " + e.getMessage());
                  }
              }

              public static void addSnapshot(String playerName, PlayerSnapshot snap) {
                  allData.computeIfAbsent(playerName, k -> new ArrayList<>()).add(0, snap);
                  save();
              }

              public static void runAutoDelete() {
                  if (!autoDeleteEnabled) return;
                  long cutoff = Instant.now().minusSeconds(ARCHIVE_DAYS * 86400L).toEpochMilli();
                  allData.forEach((name, snaps) -> snaps.removeIf(s -> s.timestamp < cutoff));
                  allData.entrySet().removeIf(e -> e.getValue().isEmpty());
                  save();
              }

              public static Map<String, List<PlayerSnapshot>> getRecent() {
                  long cutoff = Instant.now().minusSeconds(86400L).toEpochMilli();
                  Map<String, List<PlayerSnapshot>> result = new LinkedHashMap<>();
                  allData.forEach((name, snaps) -> {
                      List<PlayerSnapshot> recent = snaps.stream().filter(s -> s.timestamp >= cutoff).toList();
                      if (!recent.isEmpty()) result.put(name, recent);
                  });
                  return result;
              }

              public static Map<String, List<PlayerSnapshot>> getArchive() {
                  long cutoff = Instant.now().minusSeconds(86400L).toEpochMilli();
                  Map<String, List<PlayerSnapshot>> result = new LinkedHashMap<>();
                  allData.forEach((name, snaps) -> {
                      List<PlayerSnapshot> old = snaps.stream().filter(s -> s.timestamp < cutoff).toList();
                      if (!old.isEmpty()) result.put(name, old);
                  });
                  return result;
              }

              private static Path getDataPath() {
                  return Minecraft.getInstance().gameDirectory.toPath()
                          .resolve("inspect-mod-data/players.json");
              }
          }
          EOF

      # ── PlayerTracker.java ───────────────────────────────────
      - name: Write PlayerTracker.java
        run: |
          cat > src/main/java/com/inspectmod/data/PlayerTracker.java << 'EOF'
          package com.inspectmod.data;

          import com.inspectmod.client.ModConfig;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.component.BundleContents;
          import net.minecraft.world.item.component.ItemContainerContents;

          import java.util.*;

          /**
           * Mojang Mappings (1.21.11):
           *   DataComponents  instead of DataComponentTypes
           *   BundleContents  instead of BundleContentsComponent
           *   ItemContainerContents instead of ContainerComponent
           *   Player          instead of PlayerEntity
           */
          public class PlayerTracker {

              private static final Map<String, String> lastSeenHash = new HashMap<>();

              public static void tick(Iterable<? extends Player> nearbyPlayers) {
                  for (Player player : nearbyPlayers) {
                      String name = player.getName().getString();
                      List<ItemStack> allStacks = getAllStacks(player);
                      List<PlayerSnapshot.ContainerEntry> found = new ArrayList<>();

                      for (ItemStack stack : allStacks) {
                          if (stack.isEmpty()) continue;
                          String id = stack.getItem().toString();

                          if (ModConfig.trackShulkers && id.contains("shulker_box")) {
                              PlayerSnapshot.ContainerEntry entry = new PlayerSnapshot.ContainerEntry();
                              entry.type     = "shulker";
                              entry.color    = extractColor(id);
                              entry.itemId   = id;
                              entry.contents = readContainer(stack);
                              found.add(entry);
                          } else if (ModConfig.trackBundles && id.contains("bundle")) {
                              PlayerSnapshot.ContainerEntry entry = new PlayerSnapshot.ContainerEntry();
                              entry.type     = "bundle";
                              entry.color    = "orange";
                              entry.itemId   = id;
                              entry.contents = readBundle(stack);
                              found.add(entry);
                          }
                      }

                      if (found.isEmpty()) continue;
                      String hash = found.toString();
                      if (hash.equals(lastSeenHash.get(name))) continue;
                      lastSeenHash.put(name, hash);

                      PlayerSnapshot snap = new PlayerSnapshot(name);
                      snap.containers.put("held", found);
                      StoredPlayerData.addSnapshot(name, snap);
                  }
              }

              private static List<ItemStack> getAllStacks(Player player) {
                  List<ItemStack> stacks = new ArrayList<>();
                  stacks.add(player.getMainHandItem());
                  stacks.add(player.getOffhandItem());
                  for (ItemStack s : player.getArmorSlots()) stacks.add(s);
                  return stacks;
              }

              // Shulker: ItemContainerContents in Mojang Mappings
              private static List<String> readContainer(ItemStack stack) {
                  List<String> contents = new ArrayList<>();
                  ItemContainerContents container = stack.get(DataComponents.CONTAINER);
                  if (container == null) return contents;
                  container.nonEmptyItems().forEach(item ->
                      contents.add(cleanId(item.getItem().toString())
                          + (item.getCount() > 1 ? " x" + item.getCount() : "")));
                  return contents;
              }

              // Bundle: BundleContents in Mojang Mappings
              private static List<String> readBundle(ItemStack stack) {
                  List<String> contents = new ArrayList<>();
                  BundleContents bundle = stack.get(DataComponents.BUNDLE_CONTENTS);
                  if (bundle == null) return contents;
                  bundle.itemCopyStream().forEach(item ->
                      contents.add(cleanId(item.getItem().toString())
                          + (item.getCount() > 1 ? " x" + item.getCount() : "")));
                  return contents;
              }

              private static String extractColor(String id) {
                  String[] colors = {"white","orange","magenta","light_blue","yellow",
                          "lime","pink","gray","light_gray","cyan","purple",
                          "blue","brown","green","red","black"};
                  for (String c : colors) if (id.contains(c)) return c;
                  return "purple";
              }

              private static String cleanId(String id) {
                  String name = id.replace("minecraft:", "").replace("_", " ");
                  StringBuilder sb = new StringBuilder();
                  for (String word : name.split(" "))
                      if (!word.isEmpty())
                          sb.append(Character.toUpperCase(word.charAt(0)))
                            .append(word.substring(1)).append(" ");
                  return sb.toString().trim();
              }
          }
          EOF

      # ── InspectHud.java ──────────────────────────────────────
      - name: Write InspectHud.java
        run: |
          cat > src/main/java/com/inspectmod/client/InspectHud.java << 'EOF'
          package com.inspectmod.client;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.enchantment.ItemEnchantments;

          import java.util.Map;

          public class InspectHud {

              // Called from HudRenderCallback (DrawContext, RenderTickCounter) in 1.21.11
              public static void render(GuiGraphics graphics, float partialTick) {
                  if (!ModConfig.hudEnabled) return;
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.level == null || mc.player == null) return;

                  for (Player player : mc.level.players()) {
                      if (player == mc.player) continue;
                      if (mc.player.distanceTo(player) > 32) continue;
                      renderPlayerTag(graphics, mc, player);
                  }
              }

              private static void renderPlayerTag(GuiGraphics graphics, Minecraft mc, Player player) {
                  int sw = mc.getWindow().getGuiScaledWidth();
                  int sh = mc.getWindow().getGuiScaledHeight();
                  int sx = sw / 2;
                  int sy = sh / 2 - 40;

                  String name   = player.getName().getString();
                  int nameW     = mc.font.width(name);

                  // ── Main Hand (left of name) ─────────────────────
                  ItemStack main = player.getMainHandItem();
                  if (ModConfig.showMainHand && !main.isEmpty()) {
                      int ix = sx - nameW / 2 - 22;
                      graphics.renderItem(main, ix, sy - 8);
                      if (ModConfig.showEnchantments)
                          drawEnchants(graphics, mc, main, ix - 2, sy - 8, true);
                  }

                  // ── Off Hand (right of name) ─────────────────────
                  ItemStack off = player.getOffhandItem();
                  if (ModConfig.showOffHand && !off.isEmpty()) {
                      int ix = sx + nameW / 2 + 4;
                      graphics.renderItem(off, ix, sy - 8);
                      if (ModConfig.showEnchantments)
                          drawEnchants(graphics, mc, off, ix + 18, sy - 8, false);
                  }

                  // ── Armor row ────────────────────────────────────
                  if (ModConfig.showArmor) {
                      int ay = sy + 2;
                      int ax = sx - 32;
                      // getArmorSlots: boots(0) legs(1) chest(2) head(3)
                      int slot = 0;
                      for (ItemStack armor : player.getArmorSlots()) {
                          if (!armor.isEmpty()) {
                              int x = ax + slot * 18;
                              graphics.renderItem(armor, x, ay);
                              if (ModConfig.showEnchantments)
                                  drawEnchantsBelow(graphics, mc, armor, x, ay + 18);
                          }
                          slot++;
                      }
                  }
              }

              private static void drawEnchants(GuiGraphics g, Minecraft mc,
                                               ItemStack stack, int x, int y, boolean leftAlign) {
                  ItemEnchantments enchs = stack.get(DataComponents.ENCHANTMENTS);
                  if (enchs == null || enchs.isEmpty()) return;
                  int ey = y;
                  for (var entry : enchs.entrymentSet()) {
                      String text = "\u00a7b" + shorten(entry.getKey().value()
                              .description().getString()) + " " + toRoman(entry.getIntValue());
                      int tw = mc.font.width(text);
                      int ex = leftAlign ? x - tw : x;
                      g.fill(ex - 1, ey - 1, ex + tw + 1, ey + 8, 0x88000000);
                      g.drawString(mc.font, text, ex, ey, 0xFFFFFF);
                      ey += 9;
                  }
              }

              private static void drawEnchantsBelow(GuiGraphics g, Minecraft mc,
                                                    ItemStack stack, int x, int y) {
                  ItemEnchantments enchs = stack.get(DataComponents.ENCHANTMENTS);
                  if (enchs == null || enchs.isEmpty()) return;
                  int ey = y;
                  for (var entry : enchs.entrymentSet()) {
                      String text = "\u00a7b" + shorten(entry.getKey().value()
                              .description().getString()) + " " + toRoman(entry.getIntValue());
                      g.fill(x - 1, ey - 1, x + 36, ey + 8, 0x88000000);
                      g.drawString(mc.font, text, x, ey, 0xFFFFFF);
                      ey += 9;
                  }
              }

              private static String shorten(String s) {
                  Map<String, String> m = Map.of(
                      "Sharpness","Sharp","Protection","Prot",
                      "Unbreaking","Unbr","Efficiency","Eff",
                      "Fortune","Fort","Power","Pow",
                      "Mending","Mend","Looting","Loot"
                  );
                  return m.getOrDefault(s, s.length() > 6 ? s.substring(0, 5) : s);
              }

              private static String toRoman(int n) {
                  String[] r = {"","I","II","III","IV","V","VI","VII","VIII","IX","X"};
                  return (n >= 1 && n <= 10) ? r[n] : String.valueOf(n);
              }
          }
          EOF

      # ── MainScreen.java ──────────────────────────────────────
      - name: Write MainScreen.java
        run: |
          cat > src/main/java/com/inspectmod/client/MainScreen.java << 'EOF'
          package com.inspectmod.client;

          import com.inspectmod.data.PlayerSnapshot;
          import com.inspectmod.data.StoredPlayerData;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.network.chat.Component;

          import java.time.Instant;
          import java.time.ZoneId;
          import java.time.format.DateTimeFormatter;
          import java.util.*;

          public class MainScreen extends Screen {

              private boolean showArchive = false;
              private int scrollOffset   = 0;
              private PopupData popup     = null;

              private static final Map<String, Integer> SHULKER_COLORS = Map.ofEntries(
                  Map.entry("white",      0xFFFFFF), Map.entry("orange",     0xFF6A00),
                  Map.entry("magenta",    0xFF00FF), Map.entry("light_blue",  0x00BFFF),
                  Map.entry("yellow",     0xFFFF00), Map.entry("lime",        0x7CFF00),
                  Map.entry("pink",       0xFF69B4), Map.entry("gray",        0x808080),
                  Map.entry("light_gray", 0xD3D3D3), Map.entry("cyan",        0x00CED1),
                  Map.entry("purple",     0x9400D3), Map.entry("blue",        0x0000FF),
                  Map.entry("brown",      0x8B4513), Map.entry("green",       0x008000),
                  Map.entry("red",        0xFF0000), Map.entry("black",       0x333333)
              );

              public MainScreen() {
                  super(Component.literal("Inspect Mod"));
              }

              @Override
              protected void init() {
                  int w = this.width;
                  addRenderableWidget(Button.builder(Component.literal("Recent"),
                      b -> { showArchive = false; scrollOffset = 0; })
                      .bounds(w/2 - 120, 8, 110, 20).build());

                  addRenderableWidget(Button.builder(Component.literal("Archive"),
                      b -> { showArchive = true; scrollOffset = 0; })
                      .bounds(w/2 + 10, 8, 110, 20).build());

                  addRenderableWidget(Button.builder(Component.literal("Settings"),
                      b -> minecraft.setScreen(new SettingsScreen(this)))
                      .bounds(w - 70, 8, 62, 20).build());

                  addRenderableWidget(Button.builder(
                      Component.literal(StoredPlayerData.autoDeleteEnabled
                          ? "Auto-Delete: ON" : "Auto-Delete: OFF"),
                      b -> {
                          StoredPlayerData.autoDeleteEnabled = !StoredPlayerData.autoDeleteEnabled;
                          b.setMessage(Component.literal(StoredPlayerData.autoDeleteEnabled
                              ? "Auto-Delete: ON" : "Auto-Delete: OFF"));
                          StoredPlayerData.save();
                      }).bounds(8, 8, 130, 20).build());
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float delta) {
                  g.fill(0, 0, width, height, 0xDD101010);
                  g.fill(0, 32, width, 33, 0xFF444444);

                  Map<String, List<PlayerSnapshot>> data = showArchive
                      ? StoredPlayerData.getArchive() : StoredPlayerData.getRecent();

                  int y = 40 - scrollOffset;
                  int rowH = 36;

                  if (data.isEmpty()) {
                      g.drawCenteredString(font,
                          showArchive ? "No archive yet." : "No players seen yet!",
                          width / 2, height / 2, 0xAAAAAA);
                  }

                  for (var entry : data.entrySet()) {
                      String pName = entry.getKey();
                      List<PlayerSnapshot> snaps = entry.getValue();
                      if (snaps.isEmpty()) continue;
                      PlayerSnapshot latest = snaps.get(0);

                      g.fill(8, y, width - 8, y + rowH - 2, 0x88222222);
                      g.fill(8, y, width - 8, y + 1, 0x88555555);

                      g.drawString(font, pName, 14, y + 4, 0xFFD700);
                      g.drawString(font, formatTime(latest.timestamp), 14, y + 16, 0x888888);

                      // Container icons
                      int iconX = 150;
                      for (var ce : latest.containers.values()) {
                          for (PlayerSnapshot.ContainerEntry c : ce) {
                              int color = SHULKER_COLORS.getOrDefault(c.color, 0x9400D3);
                              boolean isBundle = "bundle".equals(c.type);

                              g.fill(iconX, y + 6, iconX + 20, y + 26, 0xFF000000 | (color & 0xFFFFFF));
                              g.drawCenteredString(font, isBundle ? "B" : "S",
                                  iconX + 10, y + 11, 0xFFFFFF);

                              if (mouseX >= iconX && mouseX <= iconX + 20
                               && mouseY >= y + 6 && mouseY <= y + 26)
                                  popup = new PopupData(pName, c, mouseX, mouseY);

                              iconX += 24;
                          }
                      }
                      y += rowH;
                  }

                  if (popup != null) { drawPopup(g, popup); popup = null; }
                  super.render(g, mouseX, mouseY, delta);
              }

              private void drawPopup(GuiGraphics g, PopupData p) {
                  int pw = 160;
                  int ph = 16 + p.entry.contents.size() * 11 + 8;
                  int px = Math.min(p.x + 4, width - pw - 4);
                  int py = Math.min(p.y + 4, height - ph - 4);

                  g.fill(px, py, px + pw, py + ph, 0xEE111111);
                  g.fill(px, py, px + pw, py + 1, 0xFFD4A017);

                  String title = ("shulker".equals(p.entry.type) ? "Shulker " : "Bundle ")
                      + p.playerName + " [" + p.entry.color + "]";
                  g.drawString(font, title, px + 4, py + 4, 0xFFD700);

                  int ly = py + 16;
                  if (p.entry.contents.isEmpty()) {
                      g.drawString(font, "(empty)", px + 8, ly, 0x888888);
                  } else {
                      for (String item : p.entry.contents) {
                          g.drawString(font, "* " + item, px + 8, ly, 0xFFFFFF);
                          ly += 11;
                      }
                  }
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double dx, double dy) {
                  scrollOffset -= (int)(dy * 12);
                  if (scrollOffset < 0) scrollOffset = 0;
                  return true;
              }

              @Override
              public boolean isPauseScreen() { return false; }

              private String formatTime(long epochMs) {
                  return DateTimeFormatter.ofPattern("MM/dd HH:mm")
                      .withZone(ZoneId.systemDefault())
                      .format(Instant.ofEpochMilli(epochMs));
              }

              private record PopupData(String playerName,
                                       PlayerSnapshot.ContainerEntry entry,
                                       int x, int y) {}
          }
          EOF

      # ── SettingsScreen.java ──────────────────────────────────
      - name: Write SettingsScreen.java
        run: |
          cat > src/main/java/com/inspectmod/client/SettingsScreen.java << 'EOF'
          package com.inspectmod.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.network.chat.Component;

          import java.util.function.*;

          public class SettingsScreen extends Screen {

              private final Screen parent;

              public SettingsScreen(Screen parent) {
                  super(Component.literal("Settings"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int cx = width / 2, y = 40, bw = 220, bh = 20, gap = 24;
                  toggle("HUD (above players)",    cx, y,         bw, bh, () -> ModConfig.hudEnabled,       v -> ModConfig.hudEnabled = v);
                  toggle("Show Armor",             cx, y + gap,   bw, bh, () -> ModConfig.showArmor,        v -> ModConfig.showArmor = v);
                  toggle("Show Enchantments",      cx, y + gap*2, bw, bh, () -> ModConfig.showEnchantments, v -> ModConfig.showEnchantments = v);
                  toggle("Show Main Hand",         cx, y + gap*3, bw, bh, () -> ModConfig.showMainHand,     v -> ModConfig.showMainHand = v);
                  toggle("Show Off Hand",          cx, y + gap*4, bw, bh, () -> ModConfig.showOffHand,      v -> ModConfig.showOffHand = v);
                  toggle("Track Shulkers",         cx, y + gap*5, bw, bh, () -> ModConfig.trackShulkers,    v -> ModConfig.trackShulkers = v);
                  toggle("Track Bundles",          cx, y + gap*6, bw, bh, () -> ModConfig.trackBundles,     v -> ModConfig.trackBundles = v);

                  addRenderableWidget(Button.builder(Component.literal("Back"),
                      b -> minecraft.setScreen(parent))
                      .bounds(cx - bw/2, y + gap*7 + 10, bw, bh).build());
              }

              private void toggle(String label, int cx, int y, int bw, int bh,
                                  Supplier<Boolean> get, Consumer<Boolean> set) {
                  addRenderableWidget(Button.builder(
                      Component.literal(label + ": " + (get.get() ? "ON" : "OFF")),
                      b -> {
                          set.accept(!get.get());
                          b.setMessage(Component.literal(label + ": " + (get.get() ? "ON" : "OFF")));
                      }).bounds(cx - bw/2, y, bw, bh).build());
              }

              @Override
              public void render(GuiGraphics g, int mx, int my, float delta) {
                  g.fill(0, 0, width, height, 0xDD101010);
                  g.drawCenteredString(font, "Inspect Mod Settings", width/2, 14, 0xFFD700);
                  super.render(g, mx, my, delta);
              }

              @Override
              public boolean isPauseScreen() { return false; }
          }
          EOF

